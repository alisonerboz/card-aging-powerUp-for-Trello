<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Card Age Badge">
  <rect width="144" height="144" rx="30" fill="#172B4D"/>
  <g transform="translate(72 72)">
    <!-- elapsed wedge: 12 o'clock, clockwise 210 degrees -->
    <path d="M0 0 L0 -42 A42 42 0 1 1 -21 36.37 Z" fill="#F5CD47"/>
    <!-- dial -->
    <circle r="42" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <!-- hand at the leading edge of the wedge -->
    <line x1="0" y1="0" x2="-21" y2="36.37" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <circle r="6" fill="#FFFFFF"/>
  </g>
</svg>
